SPRING_DATASOURCE_URL=jdbc:postgresql://db-host:5432/recommendations_db
SPRING_DATASOURCE_USERNAME=app_user
SPRING_DATASOURCE_PASSWORD=strong_password_here

SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

SPRING_JPA_HIBERNATE_DDL_AUTO=validate
SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
SPRING_JPA_SHOW_SQL=false

SPRING_LIQUIBASE_ENABLED=true
SPRING_LIQUIBASE_CHANGE_LOG=classpath:db/changelog/master.changelog.xml

LOGGING_LEVEL_COM_STARBANK_RECOMMENDATIONS=INFO
LOGGING_LEVEL_ORG_HIBERNATE_SQL=WARN
